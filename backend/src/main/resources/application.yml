server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-asistan

  # ─── Veritabanı ─────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/ai_asistant
    username: postgres
    password: asel.02
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        "jdbc.time_zone": UTC

  # ─── Flyway ─────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # ─── Redis (şimdilik devre dışı) ────────────
  # Docker veya standalone Redis kurulunca aktif edin
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

  # ─── Jackson ────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # ─── Mail ───────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true

# ─── JWT ────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-min-64-chars-long-1234567890}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 dakika
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 gün

  # ─── AI API Keys ─────────────────────────────
  ai:
    openai-key: ${OPENAI_API_KEY:}
    gemini-key: ${GEMINI_API_KEY:}

# ─── Swagger ──────────────────────────────────
springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path-for-config-mode: true # Bu satır çift /api sorununu çözer

# ─── Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
