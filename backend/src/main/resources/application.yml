server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-asistan

  # ─── Veritabanı ─────────────────────────────
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        "jdbc.time_zone": UTC

  # ─── Flyway ─────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # ─── Redis (şimdilik devre dışı) ────────────
  # Docker veya standalone Redis kurulunca aktif edin
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

  # ─── Jackson ────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # ─── Mail ───────────────────────────────────
  mail:
    host: ${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SMTP_PORT:${MAIL_PORT:587}}
    username: ${SMTP_USER:${MAIL_USER:}}
    password: ${SMTP_PASS:${MAIL_PASS:}}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true
 
# ─── JWT ────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-min-64-chars-long-1234567890}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}       # 60 dakika
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 gün

  # ─── AI API Keys ─────────────────────────────
  ai:
    openai-key: ${OPENAI_API_KEY:}
    gemini-key: ${GEMINI_API_KEY:}

# ─── Swagger ──────────────────────────────────
springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path-for-config-mode: true # Bu satır çift /api sorununu çözer

# ─── Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Finance module specific configurations
finance:
  currency:
    api-url: ${CURRENCY_API_URL:https://api.exchangerate-api.com/v4/latest/}
    api-key: ${CURRENCY_API_KEY:}
    update-interval: 3600000 # 1 hour in milliseconds
    retry:
      max-attempts: 3
      delay-ms: 1000
    scheduler:
      enabled: true
      initial-delay: 60000
  investment:
    recommendation:
      min-confidence-score: 50
      max-recommendations: 20
