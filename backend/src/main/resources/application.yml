server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: 20MB
    max-http-form-post-size: 20MB
    connection-timeout: 120s
    keep-alive-timeout: 120s

spring:
  application:
    name: ai-asistan
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # ─── Veritabanı ─────────────────────────────
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        "jdbc.time_zone": UTC

  # ─── Flyway ─────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  # ─── Redis (şimdilik devre dışı) ────────────
  # Docker veya standalone Redis kurulunca aktif edin
  # data:
  #   redis:
  #     host: localhost
  #     port: 6379

  # ─── Jackson ────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC



  # ─── Mail ───────────────────────────────────
  mail:
    host: ${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SMTP_PORT:${MAIL_PORT:587}}
    username: ${SMTP_USER:${MAIL_USER:}}
    password: ${SMTP_PASS:${MAIL_PASS:}}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true
 
# ─── JWT ────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-min-64-chars-long-1234567890}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}       # 60 dakika
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 gün

  # ─── AI API Keys ─────────────────────────────
  ai:
    openai-key: ${OPENAI_API_KEY:}
    gemini-key: ${GEMINI_API_KEY:}
    openrouter-key: ${OPENROUTER_API_KEY:}
    openrouter-model: ${OPENROUTER_MODEL:google/gemini-2.0-flash:free,qwen/qwen-2.5-72b-instruct:free,google/gemma-2-9b-it:free,mistralai/mistral-7b-instruct:free,deepseek/deepseek-chat:free}
    ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}

  push:
    enabled: ${PUSH_ENABLED:true}
    expo-url: ${PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
  google:
    calendar:
      enabled: ${GOOGLE_CALENDAR_ENABLED:false}
      credentials-file: ${GOOGLE_CALENDAR_CREDENTIALS_FILE:}
      calendar-id: ${GOOGLE_CALENDAR_ID:primary}
      scope: ${GOOGLE_CALENDAR_SCOPE:https://www.googleapis.com/auth/calendar.events}
      api-base-url: ${GOOGLE_CALENDAR_API_BASE_URL:https://www.googleapis.com/calendar/v3}

# ─── Swagger ──────────────────────────────────
springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    use-root-path-for-config-mode: true # Bu satır çift /api sorununu çözer

# ─── Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Finance module specific configurations
finance:
  currency:
    api-url: ${CURRENCY_API_URL:https://api.exchangerate-api.com/v4/latest/}
    api-key: ${CURRENCY_API_KEY:}
    metals:
      collectapi:
        url: ${COLLECTAPI_GOLD_URL:https://api.collectapi.com/economy/goldPrice}
        api-key: ${COLLECTAPI_API_KEY:}
        daily-request-limit: ${COLLECTAPI_DAILY_REQUEST_LIMIT:3}
        monthly-request-limit: ${COLLECTAPI_MONTHLY_REQUEST_LIMIT:100}
        scheduler-enabled: ${COLLECTAPI_SCHEDULER_ENABLED:true}
        sync-cron: ${COLLECTAPI_SYNC_CRON:0 0 9,15,21 * * *} # 3 times/day
    alpha-vantage:
      base-url: ${ALPHAVANTAGE_BASE_URL:https://www.alphavantage.co/query}
      api-key: ${ALPHAVANTAGE_API_KEY:}
      daily-request-limit: ${ALPHAVANTAGE_DAILY_REQUEST_LIMIT:500}
    update-interval: ${FINANCE_CURRENCY_UPDATE_INTERVAL_MS:300000} # Base throttle (5 min). Effective interval also respects daily limit.
    history:
      retention-days: ${CURRENCY_HISTORY_RETENTION_DAYS:30}
      cleanup-cron: ${CURRENCY_HISTORY_CLEANUP_CRON:0 30 3 * * *}
    retry:
      max-attempts: 3
      delay-ms: 1000
    scheduler:
      enabled: ${CURRENCY_SCHEDULER_ENABLED:true}
      initial-delay: 60000
      sync-cron: ${CURRENCY_SYNC_CRON:0 0 9,12,15,18,21 * * *} # 5 times/day
  investment:
    recommendation:
      min-confidence-score: 50
      max-recommendations: 20
